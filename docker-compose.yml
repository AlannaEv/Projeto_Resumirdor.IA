version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: resume_ai_api
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: resume_ai_app
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8001
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlite_data:
